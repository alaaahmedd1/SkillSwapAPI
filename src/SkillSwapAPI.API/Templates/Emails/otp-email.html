<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 100%;
            padding: 30px 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 80px;
            margin-bottom: 10px;
        }

        .app-name {
            font-size: 22px;
            font-weight: bold;
        }

        .content {
            padding: 30px;
            text-align: center;
            color: #333;
        }

            .content p {
                font-size: 15px;
                color: #555;
            }

        .otp-box {
            margin: 25px 0;
            padding: 20px;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 8px;
            background: #f1f5f9;
            border-radius: 10px;
            color: #2563eb;
        }

        .expire {
            font-size: 13px;
            color: #888;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">

            <div class="header">
                <img src="https://i.postimg.cc/jj6PdfjX/Screenshot-2026-04-13-065320.png" class="logo" />
                <div class="app-name">{{APP_NAME}}</div>
            </div>

            <div class="content">
                <h3>Verify Your Email</h3>

                <p>Use the verification code below to continue:</p>

                <div class="otp-box">{{OTP}}</div>

                <p class="expire">This code will expire in 5 minutes.</p>
            </div>

            <div class="footer">
                If you didn’t request this, you can safely ignore this email.
            </div>

        </div>
    </div>

</body>
</html>
