<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{APP_NAME}} Receipt</title>
</head>
<body>
    <h2>Payment Receipt</h2>

    <p>Hello {{USER_NAME}},</p>

    <p>Your wallet transaction receipt is attached to this email.</p>

    <p>
        <strong>Reference:</strong>
        {{TRANSACTION_REFERENCE}}
    </p>

    <p>
        <strong>Date:</strong>
        {{TRANSACTION_DATE}}
    </p>

    <p>Thank you for using {{APP_NAME}}.</p>
</body>
</html>
