name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SkillSwapAPI.sln

      - name: Build
        run: dotnet build SkillSwapAPI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SkillSwapAPI.sln --no-build --configuration Release --verbosity normal
